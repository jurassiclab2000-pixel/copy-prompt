<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="48" height="48" rx="12" fill="#0f111a"/>
  <!-- Outer glowing border -->
  <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Copy icon / Terminal Prompt symbol -->
  <g fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Prompt chevron > -->
    <path d="M14 17 L21 24 L14 31" />
    <!-- Prompt line _ -->
    <line x1="24" y1="31" x2="33" y2="31" />
  </g>
</svg>
